name: PR Checks # → Sprint 1: visible quality gate name on GitHub pull requests

on:
  pull_request:
    branches:
      - main # → Sprint 1: every PR targeting main must pass this gate
  push:
    branches:
      - main # → Sprint 1: protects direct pushes to main too

jobs:
  quality-gate:
    runs-on: ubuntu-latest # → Sprint 1: free GitHub runner used for CI validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # → Sprint 1: pulls the PR branch code into the runner

      - name: Set up Python
        uses: actions/setup-python@v5 # → Sprint 1: installs Python inside the CI runner
        with:
          python-version: "3.10" # → Sprint 1: matches local .venv Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run lint
        run: ruff check .

      - name: Run type-check
        run: mypy .

      - name: Run unit tests
        run: pytest
